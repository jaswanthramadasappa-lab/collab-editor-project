name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run client linter
        run: npm run lint -w client

      - name: Run server integration tests
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://localhost:27017/collab_editor_ci
          JWT_SECRET: github_actions_ci_jwt_secret_with_more_than_32_characters_total
          JWT_EXPIRES_IN: 1d
          COLLAB_PORT: 1235
          COLLAB_HOST: 127.0.0.1
        run: npm test -w server

      - name: Build client production bundle
        env:
          VITE_API_URL: http://localhost:5000
          VITE_COLLAB_URL: ws://localhost:1234
        run: npm run build -w client

  docker-build:
    name: Validate Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.server
          push: false
          tags: collab-editor-server:ci

      - name: Build Client Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.client
          push: false
          tags: collab-editor-client:ci
          build-args: |
            VITE_API_URL=http://localhost:5000
            VITE_COLLAB_URL=ws://localhost:1234
